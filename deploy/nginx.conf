# nginx внутри docker compose: всё проксирует в app:8000, сжимает и кеширует статику.
# Перед ним host-nginx (otto-web.online, HTTPS): реальный IP приходит в X-Real-IP, протокол — в X-Forwarded-Proto.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
# CSP: сайт студии грузит всё только со своего домена. Демо под /demo/ (шаблонные и для клиентов)
# могут подключать Google Fonts, карту Google и внешние фото.
map $uri $csp {
    ~^/demo/ "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src 'self' https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    default  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self' https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}
# HSTS только когда посетитель пришёл по HTTPS (через host-nginx); пустое значение = заголовок не отправляется
map $fwd_proto $hsts {
    https   "max-age=15552000";
    default "";
}
server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    # доверяем X-Real-IP только от host-nginx (приходит через шлюз docker), прямые клиенты подделать не могут
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security $hsts always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $csp always;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    # своя статистика (Umami, без cookies) через этот же домен: браузер не обращается к чужим адресам.
    # Открыты только скрипт и приём событий, панель Umami отсюда недоступна.
    location ~ ^/u/(script\.js|api/send)$ {
        resolver 127.0.0.11 valid=30s;
        set $umami http://umami:3000;
        rewrite ^/u/(.*)$ /$1 break;
        proxy_pass $umami;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $hsts always;
    }
}
