# otto-web.online → docker compose (nginx на 127.0.0.1:8080).
# Ставит deploy/install-domain.sh; блок 443 и редирект на HTTPS дописывает certbot.
server {
    listen 80;
    listen [::]:80;
    server_name otto-web.online www.otto-web.online;

    access_log /var/log/nginx/otto-web.online.access.log;
    error_log  /var/log/nginx/otto-web.online.error.log;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
