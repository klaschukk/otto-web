# Otto.web: app (Flask + gunicorn) за nginx. Сейчас :8080 на IP сервера, после домена — через Cloudflare.
# Запуск: make up   (передаёт GIT_SHA для /health)
services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: otto-web-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
  web:
    image: nginx:1.27-alpine
    container_name: otto-web
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
