# Otto.web: app (Flask + gunicorn) за nginx. Снаружи — host-nginx с HTTPS (otto-web.online → 127.0.0.1:8080).
# OTTO_BIND в .env: 127.0.0.1 после подключения домена (make domain), до этого :8080 открыт на IP.
# Запуск: make up   (передаёт GIT_SHA для /health)
services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    container_name: otto-web-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
  web:
    image: nginx:1.27-alpine
    container_name: otto-web
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${OTTO_BIND:-0.0.0.0}:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, umami]

# сеть контейнера со своей статистикой (Umami) на этом же сервере: nginx проксирует /u/script.js и /u/api/send
networks:
  umami:
    external: true
    name: umami_default
