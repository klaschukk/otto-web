- slug: menu-v-google-maps
  date: "2026-10-23"
  title: "Как да сложите менюто си в Google Maps (ресторант, кафе, бар) · Otto.web"
  description: "Три начина менюто на заведението да се вижда в Google Maps: линк към меню, снимки на менюто и меню в профила. Стъпка по стъпка, за собственици в Бургас и региона."
  h1: "Как да сложите менюто си в Google Maps"
  lead: "Гостът отваря картата на заведението и първо търси менюто и цените. Ако ги няма, най-често отваря картата на съседа. Ето как да ги покажете."
  body: |
    <h2>Защо менюто в Google Maps е важно</h2>
    <p>Повечето хора избират къде да ядат от телефона: пишат „ресторант“ в Google Maps, гледат оценката, снимките и менюто. Профилът на заведението в Google е безплатен и го управлявате вие, но много собственици никога не са го отваряли. Тогава там стоят само снимките на гостите, понякога стари и тъмни.</p>
    <h2>Стъпка 1. Поемете профила си</h2>
    <p>Отворете заведението в Google Maps и потърсете връзката „Заявяване на този бизнес“ или „Собственик ли сте?“. Ако я няма, профилът вече има собственик: може би колега или предишният наемател. Google ще поиска потвърждение, обикновено с видео на обекта или с код. След това управлявате профила от business.google.com или директно от Google Maps в телефона.</p>
    <h2>Стъпка 2. Линк към менюто</h2>
    <p>В редакцията на профила, в раздела за храна и напитки, има поле за линк към менюто. Сложете там адреса на онлайн менюто си. Важно е менюто да е страница, която се отваря бързо на телефон, а не PDF от 5 MB: гостът няма да чака.</p>
    <h2>Стъпка 3. Снимки на менюто</h2>
    <p>Качете снимки на менюто като собственик, в категория „Меню“. Снимайте на дневна светлина, отгоре и без отблясъци. Сменяйте ги, когато сменяте цените: стара снимка с поправени с химикал цени отблъсква повече, отколкото липсата на снимка.</p>
    <h2>Стъпка 4. Меню в самия профил</h2>
    <p>За заведения Google позволява и меню по раздели директно в профила, с ястия, описание и цена. Дали тази функция е налична, зависи от категорията на бизнеса и от държавата. Ако я виждате в редакцията на профила, попълнете поне най-поръчваните ястия.</p>
    <h2>Какво още да попълните</h2>
    <ul>
      <li>Работно време, включително за празници и извън сезона</li>
      <li>Телефон, на който някой наистина вдига</li>
      <li>Линк към сайта и към резервация, ако имате</li>
      <li>10–15 свои снимки: залата, терасата, 5–6 ястия</li>
    </ul>
    <p>Всичко това е безплатно. Ако нямате време, в пакет „Бизнес“ настройваме Google Business профила заедно със сайта.</p>
