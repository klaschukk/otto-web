pages:
  - slug: sait-za-restorant
    work: bistro-kei
    name: {bg: "ресторанти и барове", ru: "ресторанов и баров", en: "restaurants and bars"}
    bg:
      title: "Сайт за ресторант в Бургас: меню и резервации от 79 €"
      description: "Изработка на сайт за ресторант, бистро, бар или кафене в Бургас. Меню с цени от телефона, резервация на маса, карта. Първо безплатен пример. От 79 €."
      h1: "Сайт за ресторант в Бургас"
      lead: "Меню с цени, което се отваря от телефона, и резервация на маса за 20 секунди. Първо виждате пример с вашето име, после решавате."
      intro:
        - "Гостът избира къде да вечеря от телефона. Отваря картата в Google, гледа снимките и търси менюто с цените. Ако го намери само като снимка във Facebook или изобщо не го намери, отива там, където всичко е на един екран."
        - "Сайтът за заведение отговаря на три въпроса: какво има за ядене и колко струва, отворено ли е сега и как да запазя маса. Правим го така, че гостът да не търси и да не чака някой да вдигне телефона."
        - "Работим с ресторанти, бистра, пицарии, механи, барове и кафенета в Бургас, Сарафово, Поморие и Несебър."
      gets:
        - "Меню по раздели с грамаж и цени, удобно за четене от телефон"
        - "Резервация на маса с три докосвания: ден, час и брой гости. Готовото съобщение идва при вас във Viber или WhatsApp"
        - "Работно време с надпис „отворено сега“, карта и маршрут"
        - "Бутон за обаждане с едно докосване"
        - "QR код към менюто, който слагате на масите"
        - "Дизайн в стила на заведението"
      faq:
        - q: "Колко струва сайт за ресторант?"
          a: "Сайт-визитка с меню, резервация и карта е 79 € еднократно. Ако искате няколко страници, галерия и настройка на Google Business профил, пакет „Бизнес“ е 149 €. Хостингът е безплатен и месечна такса няма."
        - q: "Как работи резервацията на маса?"
          a: "Гостът избира ден, час и брой хора. Сайтът подготвя съобщение и го изпраща на вашия Viber или WhatsApp, а вие потвърждавате с един отговор. Не ви трябва отделна система с абонамент."
        - q: "Имаме страница във Facebook. Защо ни е сайт?"
          a: "Страницата остава. Но във Facebook менюто се губи между постовете, а човек, който търси ресторант в Бургас през Google, вижда сайтове и карти, а постовете във Facebook там почти не излизат. Сайтът събира менюто, цените и резервацията на един адрес."
        - q: "Менюто ни се променя често. Какво правим?"
          a: "Пращате ни новото меню и го сменяме. Два кръга корекции са в цената. Ако менюто се сменя всеки месец, има „Грижа за сайта“ за 15 € на месец: нови цени и снимки, до 30 минути промени."
        - q: "Ще излезем ли първи в Google?"
          a: "Никой не може честно да обещае първо място и ние не го обещаваме. Правим сайта бърз, удобен на телефон и с правилни заглавия. В пакет „Бизнес“ настройваме и профила на заведението в Google."
    ru:
      title: "Сайт для ресторана в Бургасе: меню и бронь от 79 €"
      description: "Сайт для ресторана, бистро, бара или кафе в Бургасе. Меню с ценами с телефона, бронь столика, карта. Сначала бесплатный пример. От 79 €."
      h1: "Сайт для ресторана в Бургасе"
      lead: "Меню с ценами, которое открывается с телефона, и бронь столика за 20 секунд. Сначала вы видите пример со своим названием, потом решаете."
      intro:
        - "Гость выбирает, где поужинать, с телефона. Открывает карту Google, смотрит фото и ищет меню с ценами. Если меню лежит только фотографией в Facebook или его нет совсем, он уходит туда, где всё на одном экране."
        - "Сайт заведения отвечает на три вопроса: что есть и сколько стоит, открыто ли сейчас и как забронировать столик. Делаем так, чтобы гостю не пришлось искать и ждать, пока кто-то возьмёт трубку."
        - "Работаем с ресторанами, бистро, пиццериями, механами, барами и кафе в Бургасе, Сарафово, Поморие и Несебре. Сайт делаем на болгарском, второй язык входит в пакет «Бизнес+»."
      gets:
        - "Меню по разделам с граммовкой и ценами, удобное для телефона"
        - "Бронь столика в три касания: день, время и число гостей. Готовое сообщение приходит вам в Viber или WhatsApp"
        - "Часы работы с отметкой «открыто сейчас», карта и маршрут"
        - "Кнопка звонка в одно касание"
        - "QR-код на меню, который ставится на столы"
        - "Дизайн в стиле заведения"
      faq:
        - q: "Сколько стоит сайт для ресторана?"
          a: "Сайт-визитка с меню, бронью и картой стоит 79 € один раз. Если нужны несколько страниц, галерея и настройка профиля Google Business, пакет «Бизнес» стоит 149 €. Хостинг бесплатный, абонентской платы нет."
        - q: "Как работает бронь столика?"
          a: "Гость выбирает день, время и число людей. Сайт готовит сообщение и отправляет его в ваш Viber или WhatsApp, вы подтверждаете одним ответом. Отдельная система с подпиской не нужна."
        - q: "У нас есть страница в Facebook. Зачем сайт?"
          a: "Страница остаётся. Но в Facebook меню теряется между постами, а человек, который ищет ресторан в Бургасе через Google, видит сайты и карты, а посты из Facebook там почти не попадаются. Сайт собирает меню, цены и бронь по одному адресу."
        - q: "Меню часто меняется. Что делать?"
          a: "Присылаете новое меню, мы меняем. Два круга правок входят в цену. Если меню меняется каждый месяц, есть «Забота о сайте» за 15 € в месяц: новые цены и фото, до 30 минут правок."
        - q: "Мы будем первыми в Google?"
          a: "Честно обещать первое место не может никто, и мы не обещаем. Делаем сайт быстрым, удобным на телефоне и с правильными заголовками. В пакете «Бизнес» настраиваем и профиль заведения в Google."
    en:
      title: "Restaurant website in Burgas: menu and bookings from €79"
      description: "A website for a restaurant, bistro, bar or café in Burgas. A menu with prices on the phone, table booking, map. A free sample first. From €79."
      h1: "Restaurant website in Burgas"
      lead: "A menu with prices that opens on the phone and a table booking in 20 seconds. You see a sample with your name first, then decide."
      intro:
        - "A guest picks where to eat on the phone. They open Google Maps, look at the photos and search for the menu with prices. If the menu is only a photo on Facebook, or missing, they go where everything is on one screen."
        - "A restaurant site answers three questions: what is on the menu and what it costs, is it open now, and how to book a table. We build it so the guest does not have to search or wait for someone to pick up."
        - "We work with restaurants, bistros, pizzerias, taverns, bars and cafés in Burgas, Sarafovo, Pomorie and Nessebar. The site is built in Bulgarian; a second language is part of the Business+ package."
      gets:
        - "A menu in sections with weights and prices, easy to read on a phone"
        - "A three-tap table booking: day, time and party size. The ready message reaches you on Viber or WhatsApp"
        - "Opening hours with an “open now” label, a map and directions"
        - "A one-tap call button"
        - "A QR code to the menu for your tables"
        - "A design in the style of your place"
      faq:
        - q: "How much does a restaurant website cost?"
          a: "A one-page site with a menu, booking and a map is €79, paid once. If you want several pages, a gallery and a Google Business profile set-up, the Business package is €149. Hosting is free and there is no monthly fee."
        - q: "How does the table booking work?"
          a: "The guest picks a day, a time and the party size. The site prepares a message and sends it to your Viber or WhatsApp, and you confirm with one reply. You do not need a separate system with a subscription."
        - q: "We have a Facebook page. Why a website?"
          a: "The page stays. But on Facebook the menu gets lost between posts, and someone searching Google for a restaurant in Burgas sees sites and maps, and Facebook posts rarely show up there. A site puts the menu, the prices and the booking at one address."
        - q: "Our menu changes often. What then?"
          a: "You send us the new menu and we change it. Two rounds of edits are included. If the menu changes every month, Site care is €15 a month: new prices and photos, up to 30 minutes of edits."
        - q: "Will we be first on Google?"
          a: "Nobody can honestly promise first place and we do not. We make the site fast, easy on a phone and with the right headings. In the Business package we also set up your place's Google profile."

  - slug: sait-za-salon
    work: studio-mila
    name: {bg: "салони за красота", ru: "салонов красоты", en: "beauty salons"}
    bg:
      title: "Сайт за салон за красота в Бургас от 79 €"
      description: "Сайт за салон за красота, маникюр или козметично студио в Бургас. Ценоразпис, галерия с вашите работи, записване във Viber. Безплатен пример. От 79 €."
      h1: "Сайт за салон за красота в Бургас"
      lead: "Ценоразпис, вашите работи и записване с едно докосване. Клиентката вижда всичко, преди да ви пише."
      intro:
        - "Клиентката избира салон по снимките на работите и по цената. В Instagram вижда снимките, но цените и свободните дни са в съобщенията. Всеки въпрос „колко е маникюр с гел лак“ ви отнема време."
        - "Сайтът слага ценоразписа, работите и бутона за записване на един екран. В каталозите стоите до конкурентите си, а на своя сайт сте само вие."
      gets:
        - "Ценоразпис по услуги, който се чете лесно от телефон"
        - "Галерия с ваши работи"
        - "Бутон за записване: съобщението идва във вашия Viber или WhatsApp"
        - "Работно време, карта и маршрут до салона"
        - "Функция специално за салон, например избор на цвят гел лак направо на сайта"
      faq:
        - q: "Колко струва сайт за салон?"
          a: "Сайт-визитка с ценоразпис, галерия и записване е 79 € еднократно. Хостингът е безплатен и месечна такса няма."
        - q: "Имаме Instagram и профил в каталог. Трябва ли ни сайт?"
          a: "Те остават. Instagram показва работите, но не и ценоразписа. В каталога клиентката вижда и съседните салони. Сайтът е мястото, където има цени, работи и записване само за вашия салон."
        - q: "Може ли клиентките да се записват онлайн?"
          a: "В сайта-визитка записването става със съобщение във Viber или WhatsApp и вие потвърждавате часа. Онлайн заявка за час с известие е част от пакет „Бизнес+“ за 249 €."
        - q: "Нямаме професионални снимки. Какво правим?"
          a: "Взимаме най-добрите снимки от вашата страница, с ваше съгласие. Професионалната фотосесия не е включена в цената."
    ru:
      title: "Сайт для салона красоты в Бургасе от 79 €"
      description: "Сайт для салона красоты, маникюра или косметической студии в Бургасе. Прайс, галерея ваших работ, запись через Viber. Бесплатный пример. От 79 €."
      h1: "Сайт для салона красоты в Бургасе"
      lead: "Прайс, ваши работы и запись в одно касание. Клиентка видит всё до того, как написать вам."
      intro:
        - "Клиентка выбирает салон по двум вещам: как выглядят работы и сколько это стоит. В Instagram она видит фото, а цены и свободные дни остаются в переписке. Каждый вопрос «сколько стоит маникюр с гель-лаком» отнимает у вас время."
        - "Сайт ставит прайс, работы и кнопку записи на один экран. В каталогах вы стоите рядом с конкурентами, а на своём сайте есть только вы."
      gets:
        - "Прайс по услугам, который легко читать с телефона"
        - "Галерея ваших работ"
        - "Кнопка записи: сообщение приходит в ваш Viber или WhatsApp"
        - "Часы работы, карта и маршрут до салона"
        - "Функция специально для салона, например выбор цвета гель-лака прямо на сайте"
      faq:
        - q: "Сколько стоит сайт для салона?"
          a: "Сайт-визитка с прайсом, галереей и записью стоит 79 € один раз. Хостинг бесплатный, абонентской платы нет."
        - q: "У нас есть Instagram и профиль в каталоге. Нужен ли сайт?"
          a: "Они остаются. Instagram показывает работы, но не прайс. В каталоге клиентка видит и соседние салоны. Сайт — это место, где цены, работы и запись относятся только к вашему салону."
        - q: "Можно ли записываться онлайн?"
          a: "В сайте-визитке запись идёт сообщением в Viber или WhatsApp, и вы подтверждаете время. Онлайн-заявка на время с уведомлением входит в пакет «Бизнес+» за 249 €."
        - q: "У нас нет профессиональных фото. Что делать?"
          a: "Берём лучшие снимки с вашей страницы, с вашего согласия. Профессиональная съёмка в цену не входит."
    en:
      title: "Beauty salon website in Burgas from €79"
      description: "A website for a beauty salon, nail studio or cosmetic studio in Burgas. Price list, a gallery of your work, booking via Viber. A free sample. From €79."
      h1: "Beauty salon website in Burgas"
      lead: "A price list, your work and one-tap booking. The client sees everything before she writes to you."
      intro:
        - "A client picks a salon by the photos of the work and by the price. Instagram shows the photos, but the prices and free days stay in the messages. Every “how much is a gel manicure” takes your time."
        - "A site puts the price list, the work and the booking button on one screen. In directories you sit next to your competitors; on your own site there is only you."
      gets:
        - "A price list by service, easy to read on a phone"
        - "A gallery of your work"
        - "A booking button: the message reaches your Viber or WhatsApp"
        - "Opening hours, a map and directions to the salon"
        - "A feature made for salons, such as picking a gel polish colour right on the site"
      faq:
        - q: "How much does a salon website cost?"
          a: "A one-page site with a price list, a gallery and booking is €79, paid once. Hosting is free and there is no monthly fee."
        - q: "We have Instagram and a directory profile. Do we need a site?"
          a: "They stay. Instagram shows the work but not the price list. In a directory the client also sees the salons next door. A site is where the prices, the work and the booking are yours alone."
        - q: "Can clients book online?"
          a: "On a one-page site booking is a message on Viber or WhatsApp and you confirm the time. An online request for a time slot with a notification is part of the Business+ package at €249."
        - q: "We have no professional photos. What then?"
          a: "We take the best photos from your page, with your consent. A professional photo shoot is not included in the price."

