        - "Списък с услуги и ориентировъчни цени"
        - "Бутон за обаждане и запитване във Viber с едно докосване"
        - "Карта, маршрут и работно време"
        - "Сайт, който се отваря бързо на телефон, дори със слаб интернет"
        - "Функция специално за сервиз, например калкулатор на цената по клас на колата"
