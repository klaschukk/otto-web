      title: "Сайт за автосервиз в Бургас от 79 €"
      description: "Сайт за автосервиз, гуми или автомивка в Бургас. Услуги с цени, бутон за обаждане, карта и запитване във Viber. Безплатен пример. От 79 €."
      h1: "Сайт за автосервиз в Бургас"
      lead: "Услуги с цени, които се виждат преди обаждането. Клиентът звъни на този сервиз, при който знае какво го чака."
      intro:
        - "Човек търси сервиз, когато колата вече не е наред. Отваря картата, вижда няколко сервиза наблизо и звъни на първия, при който се вижда цена. Повече се притеснява от сметката, отколкото от самия ремонт."
        - "Сайтът показва услугите, ориентировъчните цени и работното време, преди клиентът да вдигне телефона. Така получавате обаждания от хора, които вече знаят какво искат."
      gets:
        - "Списък с услуги и ориентировъчни цени"
        - "Бутон за обаждане и запитване във Viber с едно докосване"
        - "Карта, маршрут и работно време"
        - "Сайт, който се отваря бързо на телефон, дори със слаб интернет"
        - "Функция специално за сервиз, например калкулатор на цената по клас на колата"
      faq:
        - q: "Колко струва сайт за автосервиз?"
          a: "Сайт-визитка с услуги, цени, карта и бутони за връзка е 79 € еднократно. Хостингът е безплатен и месечна такса няма."
        - q: "Не мога да дам точни цени. Какво пишем?"
