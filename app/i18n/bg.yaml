faq:
  eyebrow: "Въпроси"
  h2: "Често задавани въпроси"
  items:
    - q: "Колко време отнема?"
      a: "Визитка: 3–4 дни. „Бизнес“: 5–7 дни. Срокът започва, когато получим текстовете и снимките ви. Ако нямате, помагаме да ги съберем."
    - q: "Трябва ли да плащам предварително?"
      a: "Примерът е безплатен. Ако ви хареса, подписваме договор. За визитка плащате след приемане. За „Бизнес“ и „Бизнес+“ има аванс, записан в договора."
    - q: "Чий е сайтът и домейнът?"
      a: "Ваши. Домейнът е на ваше име, сайтът е на ваш акаунт. Ако спрем да работим заедно, всичко остава при вас."
    - q: "Има ли месечна такса?"
      a: "Не е задължителна. Хостингът е безплатен. „Грижа за сайта“ за 15 € на месец е по желание: ако искате ние да сменяме цени и снимки."
    - q: "Издавате ли фактура?"
      a: "Да, работим през фирма. Фирмата не е регистрирана по ДДС, затова цените са крайни."
    - q: "Ще ме намират ли в Google?"
      a: "Сайтът е бърз, на телефон и с правилни заглавия по услуги. В пакет „Бизнес“ настройваме и Google Business профила. Никой не може честно да гарантира първо място в Google."
