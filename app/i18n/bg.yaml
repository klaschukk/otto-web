privacy:
  title: "Поверителност: как пазим данните ви · Otto.web"
  h1: "Как пазим данните"
  updated: "Актуализирано: 10 октомври 2026 г."
  sections:
    - h: "Кой отговаря за данните"
      p: "Администратор на личните данни е {company}. Връзка: {email}, тел. {phone}."
    - h: "Какви данни събираме"
      p: "Когато изпратите формата: име, бизнес, телефон и съобщение, ако сте написали такова. Записваме и IP адреса и часа на заявката, за да спираме спам (до 5 заявки на час от един адрес)."
    - h: "За какво ги използваме"
      p: "Само за да отговорим на заявката ви и да подготвим пример или оферта. Основание: стъпки преди сключване на договор по ваше искане (чл. 6, ал. 1, буква „б“ от GDPR). IP адресът се пази на основание законен интерес: защита от злоупотреби (буква „е“)."
    - h: "Колко време ги пазим"
      p: "До 12 месеца от заявката. След това се изтриват автоматично. Ако сключим договор, данните по него се пазят толкова, колкото изисква счетоводното законодателство."
    - h: "Кой ги вижда"
      p: "Само ние. Сайтът и базата със заявки са на наш сървър при netcup GmbH в Германия. За нова заявка получаваме известие в Telegram с името, бизнеса и телефона ви. Не продаваме и не предаваме данни на трети лица за реклама."
    - h: "Бисквитки и проследяване"
      p: "Сайтът на студиото не използва рекламни или аналитични бисквитки и зарежда шрифтовете и скриптовете от собствения сървър. Водим анонимна статистика на посещенията със собствена инсталация на Umami на нашия сървър: без бисквитки, без профили и без предаване на данни на трети страни. Демо сайтовете в /demo/ може да зареждат карта от Google Maps и шрифтове от Google Fonts; тогава IP адресът ви се предава на Google."
    - h: "Вашите права"
      p: "Можете да поискате достъп до данните си, поправка, изтриване, ограничаване, преносимост, или да възразите срещу обработването. Пишете на {email}: отговаряме до 30 дни. Имате право на жалба до Комисията за защита на личните данни (КЗЛД), www.cpdp.bg."
