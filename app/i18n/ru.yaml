privacy:
  title: "Конфиденциальность: как мы храним данные · Otto.web"
  h1: "Как мы храним данные"
  updated: "Обновлено: 10 октября 2026 г."
  sections:
    - h: "Кто отвечает за данные"
      p: "Оператор персональных данных — {company}. Связь: {email}, тел. {phone}."
    - h: "Какие данные собираем"
      p: "Когда вы отправляете форму: имя, бизнес, телефон и сообщение, если вы его написали. Также сохраняем IP-адрес и время заявки, чтобы отсекать спам (не больше 5 заявок в час с одного адреса)."
    - h: "Зачем"
      p: "Только чтобы ответить на заявку и подготовить пример или предложение. Основание: действия до заключения договора по вашему запросу (ст. 6(1)(b) GDPR). IP-адрес хранится на основании законного интереса — защиты от злоупотреблений (ст. 6(1)(f))."
    - h: "Сколько храним"
      p: "До 12 месяцев с момента заявки, потом данные удаляются автоматически. Если мы заключим договор, данные по нему хранятся столько, сколько требует бухгалтерское законодательство."
    - h: "Кто их видит"
      p: "Только мы. Сайт и база заявок находятся на нашем сервере у netcup GmbH в Германии. О новой заявке мы получаем уведомление в Telegram с вашим именем, бизнесом и телефоном. Мы не продаём и не передаём данные третьим лицам для рекламы."
    - h: "Cookies и отслеживание"
      p: "Сайт студии не использует рекламные и аналитические cookies и загружает шрифты и скрипты с собственного сервера. Мы ведём анонимную статистику посещений на собственной установке Umami на нашем сервере: без cookies, без профилей и без передачи данных третьим лицам. Демо-сайты в /demo/ могут загружать карту Google Maps и шрифты Google Fonts; в этом случае ваш IP-адрес передаётся Google."
    - h: "Ваши права"
      p: "Вы можете запросить доступ к своим данным, исправление, удаление, ограничение обработки, перенос или возразить против обработки. Пишите на {email}: отвечаем в течение 30 дней. Вы вправе подать жалобу в Комиссию по защите персональных данных Болгарии (КЗЛД), www.cpdp.bg."
