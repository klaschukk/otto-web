faq:
  eyebrow: "Вопросы"
  h2: "Частые вопросы"
  items:
    - q: "Сколько времени это занимает?"
      a: "Визитка: 3–4 дня. «Бизнес»: 5–7 дней. Отсчёт начинается, когда мы получаем ваши тексты и фото. Если их нет, поможем собрать."
    - q: "Нужно платить заранее?"
      a: "Пример бесплатный. Если понравится, подписываем договор. За визитку платите после приёмки. Для «Бизнес» и «Бизнес+» есть аванс, записанный в договоре."
    - q: "Чей сайт и домен?"
      a: "Ваши. Домен на ваше имя, сайт на вашем аккаунте. Если перестанем работать вместе, всё остаётся у вас."
    - q: "Есть ежемесячная плата?"
      a: "Не обязательно. Хостинг бесплатный. «Забота о сайте» за 15 € в месяц — по желанию, если хотите, чтобы цены и фото меняли мы."
    - q: "Выставляете счёт-фактуру?"
      a: "Да, работаем через фирму. Она не зарегистрирована по НДС, поэтому цены окончательные."
    - q: "Меня будут находить в Google?"
      a: "Сайт быстрый, удобный на телефоне и с правильными заголовками по услугам. В пакете «Бизнес» настраиваем и профиль Google Business. Никто не может честно гарантировать первое место в Google."
