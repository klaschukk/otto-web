privacy:
  title: "Privacy: how we handle your data · Otto.web"
  h1: "How we handle your data"
  updated: "Updated: 10 October 2026"
  sections:
    - h: "Who is responsible"
      p: "The data controller is {company}. Contact: {email}, phone {phone}."
    - h: "What we collect"
      p: "When you send the form: name, business, phone and your message, if you wrote one. We also store the IP address and time of the request to stop spam (up to 5 requests per hour from one address)."
    - h: "Why we use it"
      p: "Only to reply to your request and prepare an example or an offer. Legal basis: steps taken at your request before entering into a contract (Art. 6(1)(b) GDPR). The IP address is kept on the basis of legitimate interest in preventing abuse (Art. 6(1)(f))."
    - h: "How long we keep it"
      p: "Up to 12 months from the request, then it is deleted automatically. If we sign a contract, its data is kept as long as accounting law requires."
    - h: "Who sees it"
      p: "Only us. The site and the request database are on our server at netcup GmbH in Germany. For each new request we get a Telegram notification with your name, business and phone. We don't sell or share data with third parties for advertising."
    - h: "Cookies and tracking"
      p: "The studio site uses no advertising or analytics cookies and loads its fonts and scripts from our own server. We keep anonymous visit statistics with our own Umami installation on our server: no cookies, no profiles, nothing shared with third parties. Demo sites under /demo/ may load a Google Maps map and fonts from Google Fonts; in that case your IP address is sent to Google."
    - h: "Your rights"
      p: "You can ask for access, correction, deletion, restriction or portability of your data, or object to its processing. Write to {email}; we reply within 30 days. You may complain to the Bulgarian Commission for Personal Data Protection (CPDP), www.cpdp.bg."
