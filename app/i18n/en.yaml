faq:
  eyebrow: "Questions"
  h2: "Frequently asked questions"
  items:
    - q: "How long does it take?"
      a: "Business card: 3–4 days. Business: 5–7 days. The deadline counts from when we get your texts and photos. If you don't have them, we help you gather them."
    - q: "Do I pay upfront?"
      a: "The example is free. If you like it, we sign a contract. For a Business card you pay after acceptance. Business and Business+ have an advance written into the contract."
    - q: "Who owns the site and the domain?"
      a: "You do. The domain is in your name, the site is on your account. If we stop working together, everything stays with you."
    - q: "Is there a monthly fee?"
      a: "Not required. Hosting is free. Site care at €15 a month is optional, for when you want us to update prices and photos."
    - q: "Do you issue invoices?"
      a: "Yes, we work through a company. It is not VAT-registered, so the prices are final."
    - q: "Will people find me on Google?"
      a: "The site is fast, works on phones and has proper headings per service. In the Business package we also set up your Google Business profile. No one can honestly guarantee first place on Google."
